################
### MONITORS ###
################

source = ./monitors.conf
source = $HOME/.themes/hyprland.conf

##########################
### MODS AND VARIABLES ###
##########################
$mod = SUPER
$mod2 = ALT


###################
### DEFAULT APPS ###
###################

$terminal = kitty
$fileManager = dolphin
$menu = vicinae toggle
$browser = xdg-open https://
$calc = kalk

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,20
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = XDG_DATA_DIRS,$XDG_DATA_DIRS:$HOME/.local/share/applications/
env = SCRIPTS,$HOME/.scripts/
env = KITTY_THEME,mocha

#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --all --systemd
exec-once = vicinae server
exec-once = hyprctl setcursor Bibata-Modern-Ice 20
exec-once = awww-daemon
exec-once = hyprsunset
exec-once = hypridle
exec-once = xembedsniproxy

# Custom Scripts
exec-once = $SCRIPTS\battery-notify.sh
exec-once = $SCRIPTS\reload.sh


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = br
    kb_options = terminate:ctrl_alt_bksp
    kb_model = microsoftpro

    sensitivity = 1
    follow_mouse = 1
    numlock_by_default = true

    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# Program Launchers
bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, C, exec, $calc
bind = CTRL SHIFT, Space, exec, $menu
bind = $mod, D, exec, wofi --show drun -I -p "Search"
bind = $mod, N, exec, swaync-client -t -sw # swayNC panel
bind = $mod SHIFT, N, exec, $notepad
bind = $mod, O, exec, $terminal opencode
bind = CTRL SHIFT, ESCAPE, exec, $terminal -e htop

# Help & Scripts
bind = $mod, I, exec, $SCRIPTS\hotkeys.sh # open keybindings helper 
bind = $mod, V, exec, vicinae vicinae://launch/clipboard/history
bind = $mod, W, exec, $SCRIPTS\wallpaper-picker.sh
## Translating 
bind = $mod, T, exec, $SCRIPTS\translate.sh
bind = $mod SHIFT, T, exec, $SCRIPTS\translate.sh auto
bind = $mod CTRL, T, exec, $SCRIPTS\translate.sh switch
bind = $mod CTRL SHIFT, T, exec, $SCRIPTS\translate.sh set

# Reload / Reset
bind = $mod, R, exec, $SCRIPTS\reload.sh

# Window Control
bind = $mod, Q, killactive,
bind = $mod, F, togglefloating,
bind = $mod SHIFT, F, fullscreen, # dwindle
bind = $mod, P, pseudo, # dwindle
# bind = $mod, S, togglesplit, # dwindle

# Power Management
bind = $mod SHIFT, DELETE, exit, # default exit
bind = $mod2 SHIFT, E, exec, hyprshutdown
bind = $mod2 CTRL, DELETE, exit,
bind = $mod2 SHIFT, L, exec, hyprlock
bind = $mod2 SHIFT, P, exec, systemctl poweroff
bind = $mod2 SHIFT, R, exec, systemctl reboot
bind = $mod2 SHIFT, H, exec, systemctl hibernate  

# Focus Movement
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Workspace Navigation
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bind = $mod, TAB, workspace, e+1
bind = $mod SHIFT, TAB, workspace, e-1

# Switch workspaces 1-10
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move Windows in the same workspace
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# Move Windows to other workspaces 1-10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Special Workspace (scratchpad)
bind = $mod, M, togglespecialworkspace, magic
bind = $mod SHIFT, M, movetoworkspace, special:magic

# Mouse Windows Control
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Resize with Arrows
bind = $mod CTRL, Right, resizeactive, 25 0
bind = $mod CTRL, Left, resizeactive, -25 0
bind = $mod CTRL, Up, resizeactive, 0 -25
bind = $mod CTRL, Down, resizeactive, 0 25

# Multimedia & Brightness
$notification_snd=/usr/share/sounds/freedesktop/stereo/dialog-information.oga

# Volume
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+;notify-send -u low -t 1000 Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print $2*100}')%;paplay $notification_snd
bindel = SHIFT,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+;notify-send -u low -t 1000 Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print $2*100}')%;paplay $notification_snd
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-;notify-send -u low -t 1000 Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print $2*100}')%;paplay $notification_snd
bindel = SHIFT,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-;notify-send -u low -t 1000 Volume: $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print $2*100}')%;paplay $notification_snd 

bindel = ,XF86AudioMute, exec, $SCRIPTS\toggle-mute.sh sink
bindel = ,XF86AudioMicMute, exec, $SCRIPTS\toggle-mute.sh source

# Media Control (mpv)
bindl = , XF86AudioStop, exec, playerctl stop
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+;notify-send -u low -t 1000 Brightness: $(brightnessctl g | awk '{print $1/8}')%;paplay $notification_snd
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-;notify-send -u low -t 1000 Brightness: $(brightnessctl g | awk '{print $1/8}')%;paplay $notification_snd
bindel = SHIFT, XF86MonBrightnessUp, exec, brightnessctl s 1%+;notify-send -u low -t 1000 Brightness: $(brightnessctl g | awk '{print $1/8}')%;paplay $notification_snd
bindel = SHIFT, XF86MonBrightnessDown,exec, brightnessctl s 1%-;notify-send -u low -t 1000 Brightness: $(brightnessctl g | awk '{print $1/8}')%;paplay $notification_snd 

# Recording
bind = $mod, G, exec, $SCRIPTS/recording.sh

# Screenshots
$screenshot_snd=/usr/share/sounds/freedesktop/stereo/camera-shutter.oga
bind = , Print, exec, FILE=$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png; hyprshot -s -m output -m active -o "$(dirname "$FILE")" -f "$(basename "$FILE")"; wl-copy < "$FILE"; notify-send -u low -t 1000 "Screenshot Taken";paplay $screenshot_snd
bind = $mod SHIFT, S, exec, FILE=$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png; hyprshot -s -m region -o "$(dirname "$FILE")" -f "$(basename "$FILE")"; wl-copy < "$FILE"; notify-send -u low -t 1000 "Screenshot Taken";paplay $screenshot_snd
bind = $mod SHIFT, S, exec, notify-send -u low -t 1000 "Taking Screenshot";


#####################
### WINDOWS RULES ###
#####################

# Layer Rules

layerrule = match:namespace waybar, blur on ignore_alpha 0 no_anim on
layerrule = match:namespace wofi, blur on
layerrule = match:namespace notifications, animation slide right blur on

# Swaync Rules
layerrule = match:namespace swaync-notification-window, animation slide
layerrule = match:namespace swaync-control-center, animation popin 95%
layerrule = match:namespace swaync-control-center, ignore_alpha 0.5
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.5
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-notification-window, blur on
# layerrule = match:namespace swaync-control-center, ignore_zero on
# layerrule = match:namespace swaync-notification-window, ignore_zero on

# Vicinae Rules
layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0
    match:namespace = vicinae
}

# General Float Rules
# Syntax: windowrule = match:class <regex>, <effect> <value>
windowrule = match:class ^(dialog|menu|pop-up|bubble|task_dialog|Preferences|File Operation Progress|Save As)$, float on
windowrule = match:title ^(Opening|File Upload|Save Image|Picture-in-Picture|About Mozilla Firefox|Firefox — Sharing Indicator|Pushbullet( – Mozilla Firefox)?|Extension.*)$, float on

# --- File Managers / Utilities ---
# GNOME
windowrule = match:class ^(org\.gnome\.(Nautilus|Weather|Calculator|Calendar))$, float on

# KDE
windowrule = match:class ^(org\.kde\.(kalk|dolphin|kweather))$, float on

# Games
windowrule = match:class ^(wow\.exe|cs2)$, fullscreen on, opacity 1.0 override

# Crash dialogs
windowrule = match:class .*wow\.exe.* match:title Microsoft Visual C\+\+ Runtime Library, float on
windowrule = match:class .*rundll32\.exe.*, float on

# Other Apps
windowrule = match:class ^(org\.opensuse\.YaST|ruby|org\.pulseaudio\.pavucontrol|blueman-manager|foot|xterm|nm-connection-editor|mousepad|imv)$, float on
windowrule = match:title ^(qBittorrent|mtp-ng-qt|foot)$, float on

# Focus Management / Behavior
windowrule = match:title ^(pop-up)$, no_focus on
windowrule = match:class urgent:1, focus_on_activate on

# Misc Fixes
windowrule = match:class .*, suppress_event maximize

# XWayland
windowrule = match:class ^$, match:title ^$, match:xwayland true, match:float = true, match:fullscreen = false, match:pin = false, no_focus = on


#####################
### LOOK AND FEEL ###
#####################

# Theme setup
exec-once = sleep 1 && systemctl --user import-environment

# General appearence
general {
    gaps_in = 2
    gaps_out = 4
    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $primary
    col.inactive_border = $onPrimary

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}


cursor {
    no_hardware_cursors = 0
}

# Window decorations
# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = $background
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# Animations
# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Workspace specific tweats
# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# change to 0 to no gaps at all

# Layout behavior
# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
# dwindle {
#     pseudotile = true # Master switch for pseudotiling. Enabling is bound to mod + P in the keybinds section below
#     preserve_split = true # You probably want this
# }

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# Miscellaneous
# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}
